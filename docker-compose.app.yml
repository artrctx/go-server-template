name: "templ"
services:
  auth:
    env_file: cmd/auth/.env
    environment:
      - PORT=3000
      - API_URL=http://core:8080
    build:
      context: .
      dockerfile: Dockerfile.auth
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - templ-net

  api:
    env_file: .env
    environment:
      - PORT=8080
      - AUTH_URL=http://auth:3000
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - 8080:8080
    networks:
      - templ-net

networks:
  templ-net:
