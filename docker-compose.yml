name: "shuffle"
services:
  auth:
    container_name: auth 
    image: artrctx/shuffle-auth:latest
    env_file: .env
    environment:
      - PORT=3000
      - API_URL=http://core:8080
    ports:
      - 3000:3000
    restart: "on-failure:5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
      - shuffle-net

  api:
    container_name: core
    image: artrctx/shuffle-api:latest
    env_file: .env
    environment:
      - PORT=8080
      - JWKS_URL=http://auth:3000/api/auth/jwks
      - AUTH_URL=http://auth:3000
    ports:
      - 8080:8080
    restart: "on-failure:5"
    #? Deciding to not do health check since curls not in the scratch container and i don't want to install it
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 3
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - shuffle-net

networks:
  shuffle-net:
