name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
jobs:
  build-core:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and Test
        run: |
          export SKIP_ENV_INIT=true
          go build ./cmd/api
          go test ./... -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/templ:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/templ:latest
  build-auth:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9 

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cmd/auth/pnpm-lock.yaml

      - name: Build Auth
        run: |
          cd cmd/auth
          pnpm install --frozen-lockfile
          pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Auth
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auth
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/templ-auth:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/templ-auth:latest

  deploy:
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    needs:
      - build-core
      - build-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TS_VPS_HOST }}

      - name: Copy docker file via scp
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml root@${{ vars.TS_VPS_HOST }}:~

      - name: Deploy
        run: |
          ssh root@${{ vars.TS_VPS_HOST }} "
            set -e
            echo '${{ secrets.DOCKER_TOKEN }}' | docker login -u '${{ vars.DOCKER_USERNAME }}' --password-stdin
            cd ~
          export DATABASE_URL=${{ secrets.DATABASE_URL }}
          export BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          export BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}
          export GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          export GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          export POSTHOG_TOKEN=${{ vars.POSTHOG_TOKEN }}
          export RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          export APP_EMAIL=${{ vars.APP_EMAIL }}
          export APP_ENV=${{ vars.APP_ENV }}
          ENV
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout
          "

  migration:
    needs:
      - deploy
    uses: ./.github/workflows/migration.yml
    with:
      environment: ${{ inputs.environment }} 
    secrets: inherit

     