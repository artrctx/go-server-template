name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
jobs:

  build-api:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and Test
        run: |
          export SKIP_ENV_INIT=true
          go build ./cmd/api
          go test ./... -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/shuffle-api:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/shuffle-api:latest
  build-auth:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9 

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cmd/auth/pnpm-lock.yaml

      - name: Build Auth
        run: |
          cd cmd/auth
          pnpm install --frozen-lockfile
          pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Auth
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.auth
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/shuffle-auth:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/shuffle-auth:latest

  deploy:
    environment: ${{ github.event.inputs.environment }}
    needs:
      - build-api
      - build-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy compose file
        run: |
          sshpass -p "${{ secrets.DROPLET_PASSWORD }}" \
            scp -o StrictHostKeyChecking=no \
            docker-compose.yml \
            root@${{ vars.DROPLET_IP }}:~/

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DROPLET_IP }}
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            docker login \
              -u "${{ vars.DOCKER_USERNAME }}" \
              -p "${{ secrets.DOCKER_TOKEN }}"
            cd ~
            touch .env
            > .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .env
            echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> .env 
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "POSTHOG_TOKEN=${{ secrets.POSTHOG_TOKEN }}" >> .env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            echo "R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }}" >> .env
            echo "R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }}" >> .env
            echo "R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }}" >> .env
            echo "R2_ACCESS_SECRET_KEY=${{ secrets.R2_ACCESS_SECRET_KEY }}" >> .env
            echo "APP_EMAIL=${{ vars.APP_EMAIL }}" >> .env
            echo "APP_ENV=${{ vars.APP_ENV }}" >> .env
            docker compose pull
            docker compose up -d --remove-orphans

  migration:
    environment: ${{ github.event.inputs.environment }}
    needs:
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install go-migrate
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packagecloud.io/golang-migrate/migrate/gpgkey | sudo gpg --dearmor -o /etc/apt/keyrings/migrate.gpg
          echo "deb [signed-by=/etc/apt/keyrings/migrate.gpg] https://packagecloud.io/golang-migrate/migrate/ubuntu/ $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/migrate.list
          sudo apt-get update
          sudo apt-get install -y migrate
      
      - name: Migrate
        run: migrate -database '${{ secrets.DIRECT_DATABASE_URL }}' -path migrations up

     