version: "2"

overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "timestamptz"
        nullable: false
        go_type: "time.Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true

sql:
  - engine: "postgresql"
    schema: "./migrations"
    queries: "./query/deck.sql"
    gen:
      go:
        emit_json_tags: true 
        emit_empty_slices: true
        json_tags_case_style: "camel"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        package: "deck"
        out: "./internal/database/repository/deck"

